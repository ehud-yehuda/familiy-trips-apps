    // ציוד
    const initialGear = [
      { id: "rg1", name: "פלטת שבת חשמלית + שעון שבת", qty: "1 יח'", assignee: "טרם שובץ", done: false },
      { id: "rg2", name: "מיחם מים חמים לשבת (נירוסטה)", qty: "1 יח'", assignee: "טרם שובץ", done: false },
      { id: "rg3", name: "כבל מאריך / מפצל תקעים (לחיבור בחאן)", qty: "1 יח'", assignee: "טרם שובץ", done: false },
      { id: "rg4", name: "כוס קידוש, צלחת וכיסוי חלות", qty: "1 סט", assignee: "טרם שובץ", done: false },
      { id: "rg5", name: "פמוטים / כלי זכוכית עמיד לרוח לנרות שבת", qty: "2 יח'", assignee: "טרם שובץ", done: false },
      { id: "rg6", name: "בשמים ונר להבדלה במוצאי שבת", qty: "1 סט", assignee: "טרם שובץ", done: false },

      { id: "rg9", name: "את חפירה קטן / מעדר (למטפונה ולגחלים)", qty: "1 יח'", assignee: "טרם שובץ", done: false },
      { id: "rg10", name: "סכין שף טובה וקרש חיתוך", qty: "1 סט", assignee: "טרם שובץ", done: false },
      { id: "rg11", name: "כפפות חום עמידות לגחלים", qty: "1 זוג", assignee: "טרם שובץ", done: false },
      { id: "rg12", name: "שקי שינה / שמיכות פוך חמות (לילות קרים במצפה!)", qty: "לכל ה-10", assignee: "טרם שובץ", done: false },
      { id: "rg13", name: "צידניות גדולות + קרחומים", qty: "2-3 יח'", assignee: "טרם שובץ", done: false },
      { id: "rg14", name: "תאורת שטח שבתית / פנסי ראש", qty: "4 יח'", assignee: "טרם שובץ", done: false },
      { id: "rg15", name: "ערכת עזרה ראשונה ותכשיר נגד יתושים", qty: "1 ערכה", assignee: "טרם שובץ", done: false }
    ];

    const KEY_MENU = 'ramon_menu_v5_split';
    const KEY_FOOD = 'ramon_food_v5_split';
    const KEY_GEAR = 'ramon_gear_v5_split';

    let localMenu = JSON.parse(localStorage.getItem(KEY_MENU)) || defaultMenu;
    let localFood = JSON.parse(localStorage.getItem(KEY_FOOD)) || initialFood;
    let localGear = JSON.parse(localStorage.getItem(KEY_GEAR)) || initialGear;

    function switchTab(tabId) {
      ['menu', 'food', 'gear'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors';
      });
      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      document.getElementById(`tab-${tabId}`).className = 'py-2.5 rounded-lg bg-amber-800 text-white transition-colors';
    }

    function getBadgeClass(assignee) {
      switch (assignee) {
        case 'פישר-כהן': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
        case 'בנדה-פרנקל': return 'bg-purple-100 text-purple-800 border-purple-200';
        case 'קנייה': return 'bg-amber-100 text-amber-800 border-amber-200 font-bold';
        default: return 'bg-slate-100 text-slate-600 border-slate-200';
      }
    }

    // --- MENU LOGIC ---
    function renderMenu(items) {
      ['friday_dinner', 'saturday_breakfast', 'saturday_lunch'].forEach(meal => {
        const el = document.getElementById(`menu-list-${meal}`);
        if (el) el.innerHTML = '';
      });

      items.forEach(item => {
        const listEl = document.getElementById(`menu-list-${item.meal}`);
        if (!listEl) return;

        const div = document.createElement('div');
        div.className = "p-2 rounded-lg bg-slate-50 border border-slate-200 flex justify-between items-start gap-2";
        div.innerHTML = `
          <div class="flex-1">
            <span class="font-bold text-xs text-slate-900 block">${item.title}</span>
            <p class="text-[11px] text-slate-600 mt-0.5">${item.desc}</p>
          </div>
          <div class="flex items-center gap-1 text-slate-400">
            <button onclick="editMenuItem('${item.id}')" title="ערוך מנה" class="hover:text-amber-800 p-1 text-xs">✏️</button>
            <button onclick="deleteMenuItem('${item.id}')" title="מחק מנה" class="hover:text-rose-600 p-1 text-xs">🗑️</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function addMenuItem(e) {
      e.preventDefault();
      const meal = document.getElementById('menu-meal').value;
      const title = document.getElementById('menu-title').value.trim();
      const desc = document.getElementById('menu-desc').value.trim();
      if (!title || !desc) return;

      const newItem = { id: 'm_' + Date.now(), meal, title, desc };
      if (db) {
        db.ref('ramon_trip_app/menu/' + newItem.id).set(newItem);
      } else {
        localMenu.push(newItem);
        localStorage.setItem(KEY_MENU, JSON.stringify(localMenu));
        renderMenu(localMenu);
      }
      document.getElementById('menu-title').value = '';
      document.getElementById('menu-desc').value = '';
    }

    function editMenuItem(id) {
      const item = (db ? null : localMenu.find(i => i.id === id));
      const oldTitle = item ? item.title : '';
      const oldDesc = item ? item.desc : '';

      const newTitle = prompt("ערוך כותרת מנה:", oldTitle);
      if (newTitle === null) return;
      const newDesc = prompt("ערוך פירוט מנה:", oldDesc);
      if (newDesc === null) return;

      if (db) {
        db.ref(`ramon_trip_app/menu/${id}`).update({ title: newTitle.trim(), desc: newDesc.trim() });
      } else {
        if (item) {
          item.title = newTitle.trim();
          item.desc = newDesc.trim();
          localStorage.setItem(KEY_MENU, JSON.stringify(localMenu));
          renderMenu(localMenu);
        }
      }
    }

    function deleteMenuItem(id) {
      if (!confirm("למחוק פריט זה מהתפריט?")) return;
      if (db) {
        db.ref(`ramon_trip_app/menu/${id}`).remove();
      } else {
        localMenu = localMenu.filter(i => i.id !== id);
        localStorage.setItem(KEY_MENU, JSON.stringify(localMenu));
        renderMenu(localMenu);
      }
    }

    function resetMenuDefaults() {
      if (!confirm("לאפס את התפריט לברירת המחדל?")) return;
      if (db) {
        const menuMap = {};
        defaultMenu.forEach(item => menuMap[item.id] = item);
        db.ref('ramon_trip_app/menu').set(menuMap);
      } else {
        localMenu = [...defaultMenu];
        localStorage.setItem(KEY_MENU, JSON.stringify(localMenu));
        renderMenu(localMenu);
      }
    }

    // --- FOOD LOGIC ---
    function renderFood(items) {
      const listEl = document.getElementById('food-list');
      listEl.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = `p-3 flex items-center justify-between gap-2 ${item.done ? 'bg-slate-50 opacity-60' : ''}`;
        const badge = getBadgeClass(item.assignee);

        li.innerHTML = `
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleFood('${item.id}', ${!item.done})" class="rounded text-amber-800 h-4 w-4 cursor-pointer">
            <div class="flex flex-col min-w-0 flex-1">
              <span class="text-slate-800 font-semibold truncate ${item.done ? 'line-through text-slate-400' : ''}">${item.name}</span>
              <div class="flex items-center gap-1.5 mt-1">
                <span class="text-[10px] text-slate-400 font-medium">כמות:</span>
                <input type="text" value="${item.qty || '1'}" onchange="saveFoodQty('${item.id}', this.value)" 
                  class="w-32 bg-amber-50 text-amber-900 border border-amber-300 rounded px-1.5 py-0.5 text-xs font-bold focus:ring-1 focus:ring-amber-500 focus:outline-none">
              </div>
            </div>
          </div>
          
          <div class="flex items-center gap-1">
            <select onchange="changeFoodAssignee('${item.id}', this.value)" class="text-[11px] font-semibold rounded-lg px-2 py-1 border ${badge} focus:outline-none cursor-pointer">
              <option value="קנייה" ${item.assignee === 'קנייה' ? 'selected' : ''}>🛒 קנייה</option>
              <option value="טרם שובץ" ${item.assignee === 'טרם שובץ' ? 'selected' : ''}>טרם שובץ</option>
              <option value="פישר-כהן" ${item.assignee === 'פישר-כהן' ? 'selected' : ''}>פישר-כהן</option>
              <option value="בנדה-פרנקל" ${item.assignee === 'בנדה-פרנקל' ? 'selected' : ''}>בנדה-פרנקל</option>
            </select>
            <button onclick="editFoodNamePrompt('${item.id}')" title="ערוך שם מצרך" class="text-slate-400 hover:text-amber-800 p-1">✏️</button>
            <button onclick="deleteFoodItem('${item.id}')" title="מחק מוצר" class="text-slate-400 hover:text-rose-600 p-1">🗑️</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function saveFoodQty(id, newQty) {
      if (!newQty.trim()) return;
      if (db) {
        db.ref(`ramon_trip_app/food/${id}/qty`).set(newQty.trim());
      } else {
        const item = localFood.find(i => i.id === id);
        if (item) {
          item.qty = newQty.trim();
          localStorage.setItem(KEY_FOOD, JSON.stringify(localFood));
        }
      }
    }

    function addFoodItem(e) {
      e.preventDefault();
      const name = document.getElementById('food-input').value.trim();
      const qty = document.getElementById('food-qty').value.trim() || '1 יח\'';
      const assignee = document.getElementById('food-assignee').value;
      if (!name) return;

      const newItem = { id: 'rf_' + Date.now(), name, qty, assignee, done: false };
      if (db) {
        db.ref('ramon_trip_app/food/' + newItem.id).set(newItem);
      } else {
        localFood.unshift(newItem);
        localStorage.setItem(KEY_FOOD, JSON.stringify(localFood));
        renderFood(localFood);
      }
      document.getElementById('food-input').value = '';
      document.getElementById('food-qty').value = '';
    }

    function editFoodNamePrompt(id) {
      const item = (db ? null : localFood.find(i => i.id === id));
      const oldName = item ? item.name : '';
      const newName = prompt("ערוך שם מצרך:", oldName);
      if (!newName || !newName.trim()) return;

      if (db) {
        db.ref(`ramon_trip_app/food/${id}/name`).set(newName.trim());
      } else {
        if (item) {
          item.name = newName.trim();
          localStorage.setItem(KEY_FOOD, JSON.stringify(localFood));
          renderFood(localFood);
        }
      }
    }

    function deleteFoodItem(id) {
      if (!confirm("להסיר מצרך זה?")) return;
      if (db) {
        db.ref(`ramon_trip_app/food/${id}`).remove();
      } else {
        localFood = localFood.filter(i => i.id !== id);
        localStorage.setItem(KEY_FOOD, JSON.stringify(localFood));
        renderFood(localFood);
      }
    }

    function toggleFood(id, done) {
      if (db) {
        db.ref(`ramon_trip_app/food/${id}/done`).set(done);
      } else {
        const item = localFood.find(i => i.id === id);
        if (item) item.done = done;
        localStorage.setItem(KEY_FOOD, JSON.stringify(localFood));
        renderFood(localFood);
      }
    }

    function changeFoodAssignee(id, assignee) {
      if (db) {
        db.ref(`ramon_trip_app/food/${id}/assignee`).set(assignee);
      } else {
        const item = localFood.find(i => i.id === id);
        if (item) item.assignee = assignee;
        localStorage.setItem(KEY_FOOD, JSON.stringify(localFood));
        renderFood(localFood);
      }
    }

    function resetFoodDefaults() {
      if (!confirm("לאפס את רשימת האוכל לברירת המחדל המופרדת?")) return;
      if (db) {
        const foodMap = {};
        initialFood.forEach(item => foodMap[item.id] = item);
        db.ref('ramon_trip_app/food').set(foodMap);
      } else {
        localFood = [...initialFood];
        localStorage.setItem(KEY_FOOD, JSON.stringify(localFood));
        renderFood(localFood);
      }
    }

    // --- GEAR LOGIC ---
    function renderGear(items) {
      const listEl = document.getElementById('gear-list');
      listEl.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = `p-3 flex items-center justify-between gap-2 ${item.done ? 'bg-slate-50 opacity-60' : ''}`;
        const badge = getBadgeClass(item.assignee);

        li.innerHTML = `
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleGear('${item.id}', ${!item.done})" class="rounded text-amber-800 h-4 w-4 cursor-pointer">
            <div class="flex flex-col min-w-0 flex-1">
              <span class="text-slate-800 font-semibold truncate ${item.done ? 'line-through text-slate-400' : ''}">${item.name}</span>
              <div class="flex items-center gap-1.5 mt-1">
                <span class="text-[10px] text-slate-400 font-medium">כמות:</span>
                <input type="text" value="${item.qty || '1'}" onchange="saveGearQty('${item.id}', this.value)" 
                  class="w-32 bg-slate-100 text-slate-700 border border-slate-300 rounded px-1.5 py-0.5 text-xs font-bold focus:ring-1 focus:ring-slate-400 focus:outline-none">
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <select onchange="changeGearAssignee('${item.id}', this.value)" class="text-[11px] font-semibold rounded-lg px-2 py-1 border ${badge} focus:outline-none cursor-pointer">
              <option value="טרם שובץ" ${item.assignee === 'טרם שובץ' ? 'selected' : ''}>טרם שובץ</option>
              <option value="פישר-כהן" ${item.assignee === 'פישר-כהן' ? 'selected' : ''}>פישר-כהן</option>
              <option value="בנדה-פרנקל" ${item.assignee === 'בנדה-פרנקל' ? 'selected' : ''}>בנדה-פרנקל</option>
            </select>
            <button onclick="editGearNamePrompt('${item.id}')" title="ערוך שם פריט" class="text-slate-400 hover:text-amber-800 p-1">✏️</button>
            <button onclick="deleteGearItem('${item.id}')" title="מחק פריט" class="text-slate-400 hover:text-rose-600 p-1">🗑️</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function saveGearQty(id, newQty) {
      if (!newQty.trim()) return;
      if (db) {
        db.ref(`ramon_trip_app/gear/${id}/qty`).set(newQty.trim());
      } else {
        const item = localGear.find(i => i.id === id);
        if (item) {
          item.qty = newQty.trim();
          localStorage.setItem(KEY_GEAR, JSON.stringify(localGear));
        }
      }
    }

    function addGearItem(e) {
      e.preventDefault();
      const name = document.getElementById('gear-input').value.trim();
      const qty = document.getElementById('gear-qty').value.trim() || '1 יח\'';
      const assignee = document.getElementById('gear-assignee').value;
      if (!name) return;

      const newItem = { id: 'rg_' + Date.now(), name, qty, assignee, done: false };
      if (db) {
        db.ref('ramon_trip_app/gear/' + newItem.id).set(newItem);
      } else {
        localGear.unshift(newItem);
        localStorage.setItem(KEY_GEAR, JSON.stringify(localGear));
        renderGear(localGear);
      }
      document.getElementById('gear-input').value = '';
      document.getElementById('gear-qty').value = '';
    }

    function editGearNamePrompt(id) {
      const item = (db ? null : localGear.find(i => i.id === id));
      const oldName = item ? item.name : '';
      const newName = prompt("ערוך שם פריט ציוד:", oldName);
      if (!newName || !newName.trim()) return;

      if (db) {
        db.ref(`ramon_trip_app/gear/${id}/name`).set(newName.trim());
      } else {
        if (item) {
          item.name = newName.trim();
          localStorage.setItem(KEY_GEAR, JSON.stringify(localGear));
          renderGear(localGear);
        }
      }
    }

    function deleteGearItem(id) {
      if (!confirm("להסיר פריט זה?")) return;
      if (db) {
        db.ref(`ramon_trip_app/gear/${id}`).remove();
      } else {
        localGear = localGear.filter(i => i.id !== id);
        localStorage.setItem(KEY_GEAR, JSON.stringify(localGear));
        renderGear(localGear);
      }
    }

    function toggleGear(id, done) {
      if (db) {
        db.ref(`ramon_trip_app/gear/${id}/done`).set(done);
      } else {
        const item = localGear.find(i => i.id === id);
        if (item) item.done = done;
        localStorage.setItem(KEY_GEAR, JSON.stringify(localGear));
        renderGear(localGear);
      }
    }

    function changeGearAssignee(id, assignee) {
      if (db) {
        db.ref(`ramon_trip_app/gear/${id}/assignee`).set(assignee);
      } else {
        const item = localGear.find(i => i.id === id);
        if (item) item.assignee = assignee;
        localStorage.setItem(KEY_GEAR, JSON.stringify(localGear));
        renderGear(localGear);
      }
    }

    function resetGearDefaults() {
      if (!confirm("לאפס את רשימת הציוד לברירת המחדל?")) return;
      if (db) {
        const gearMap = {};
        initialGear.forEach(item => gearMap[item.id] = item);
        db.ref('ramon_trip_app/gear').set(gearMap);
      } else {
        localGear = [...initialGear];
        localStorage.setItem(KEY_GEAR, JSON.stringify(localGear));
        renderGear(localGear);
      }
    }

    // --- INITIALIZATION ---
    if (db) {
      db.ref('ramon_trip_app/menu').on('value', snap => {
        const val = snap.val();
        if (!val) resetMenuDefaults();
        else renderMenu(Object.values(val));
      });
      db.ref('ramon_trip_app/food').on('value', snap => {
        const val = snap.val();
        if (!val) resetFoodDefaults();
        else renderFood(Object.values(val));
      });
      db.ref('ramon_trip_app/gear').on('value', snap => {
        const val = snap.val();
        if (!val) resetGearDefaults();
        else renderGear(Object.values(val));
      });
    } else {
      renderMenu(localMenu);
      renderFood(localFood);
      renderGear(localGear);
    }
  </script>
</body>
</html>
