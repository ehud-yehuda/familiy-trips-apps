const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function sections(key){
  const base=(DATA[key]||[]).map(s=>({t:s.t,items:s.items.map(str=>{
    const [n,q]=str.split("|");
    return {key:key+"|"+s.t+"|"+n, name:n, qty:q||""};
  }).filter(o=>!(state.removed||[]).includes(o.key))}));
  
  ((state.custom&&state.custom[key])||[]).forEach(c=>{
    let sec=base.find(s=>s.t===c.sec);
    if(!sec){sec={t:c.sec,items:[]};base.push(sec);}
    if(!(state.removed||[]).includes(c.key)) sec.items.push({key:c.key,name:c.name,qty:c.qty||""});
  });
  return base;
}

function totals(){
  let d=0,a=0;
  ["shopping","meat","gear"].forEach(k=>sections(k).forEach(s=>s.items.forEach(i=>{
    a++;
    if(state.checks&&state.checks[i.key]&&state.checks[i.key].d) d++;
  })));
  return{d,a};
}

function initFirebaseSync() {
  if (!dbRef) {
    $("#status").textContent = "מצב מקומי בלבד";
    return;
  }
  
  dbRef.on("value", (snapshot) => {
    const val = snapshot.val();
    if (val) {
      state = {
        checks: val.checks || {},
        qty: val.qty || {},
        custom: val.custom || {},
        removed: val.removed || [],
        plan: val.plan || null
      };
    }
    $("#status").textContent = "מסונכרן בזמן אמת";
    render();
  }, (err) => {
    $("#status").textContent = "שגיאת תקשורת עם הענן";
  });
}

function save() {
  if (!dbRef) return;
  $("#status").textContent = "שומר...";
  dbRef.set(state).then(() => {
    $("#status").textContent = "מסונכרן בזמן אמת";
  }).catch(() => {
    $("#status").textContent = "שגיאה בשמירה";
  });
}

function toolbar() {
  const b=$("#bar");
  b.innerHTML = (tab==="plan"
    ? `<button data-act="edit" class="${editing?"on":""}">${editing?"סיום עריכה":"עריכת הלו״ז"}</button>
       <button data-act="copy">העתקת הלו״ז</button>
       ${state.plan?`<button data-act="resetplan">שחזור הלו״ז המקורי</button>`:""}`
    : `<button data-act="copy">העתקה לוואטסאפ</button>
       <button data-act="copyleft">העתקת מה שנשאר</button>`);
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  toolbar();
  $("#main").innerHTML = tab==="plan"?(editing?planEditHTML():planHTML()):listHTML(tab);
  const {d,a}=totals(), N=28, f=a?Math.round(d/a*N):0;
  $("#hexrow").innerHTML=Array.from({length:N},(_,i)=>`<div class="hex ${i<f?"on":""}"></div>`).join("");
  $("#count").textContent=`${d} מתוך ${a} פריטים סומנו`;
}

function planHTML(){
  return planData().map(d=>`<article class="day"><h2>${d.d}</h2><p class="tag">${d.tag}</p>
    ${d.slots.map(s=>`<div class="slot"><time>${s.t}</time><div><strong>${s.h}</strong>
      ${s.s?`<small>${s.s}</small>`:""}
      ${s.split?`<div class="split">${s.split.map(p=>`<p>${p}</p>`).join("")}</div>`:""}
    </div></div>`).join("")}</article>`).join("")+
  `<article class="day"><h2>לזכור</h2><p class="tag">חום · תינוק · שמורות</p>
    <div class="slot"><time>חום</time><div><small>אוגוסט בגולן 33–36 מעלות. כל טיול נגמר עד 12:30, ואחר כך צל ומים.</small></div></div>
    <div class="slot"><time>מים</time><div><small>בקבוק אישי לכל אחד ביציאה, וג׳ריקן קר ברכב לחזרה.</small></div></div>
    <div class="slot"><time>שמורות</time><div><small>כניסה אחרונה ברוב השמורות 16:00, סגירה 17:00.</small></div></div>
  </article>
  <article class="day"><h2>רעיונות לערבים ולשעות המתות</h2><p class="tag">לא חובה · לבחור מה שמתאים</p>
    ${IDEAS.map(g=>`<div class="slot"><time>${g.k}</time><div>
      ${g.v.map(x=>`<p class="idea">${x}</p>`).join("")}</div></div>`).join("")}
  </article>`;
}

function listHTML(key){
  return sections(key).map(s=>{
    const d=s.items.filter(i=>state.checks[i.key]&&state.checks[i.key].d).length;
    return `<section class="sec">
      <div class="sec-h"><h2>${s.t}</h2><em>${d}/${s.items.length}</em></div>
      ${s.items.map(it=>{
        const c=state.checks[it.key]||{}, q=(state.qty[it.key]!==undefined?state.qty[it.key]:it.qty);
        return `<div class="row ${c.d?"done":""}">
          <button class="box ${c.d?"on":""}" data-k="${esc(it.key)}" aria-label="סמן ${esc(it.name)}"></button>
          <span class="name">${it.name}</span>
          <input class="qty" value="${esc(q)}" data-q="${esc(it.key)}" aria-label="כמות של ${esc(it.name)}">
          <select class="who ${c.w?"set":""}" data-w="${esc(it.key)}">
            ${WHO.map(w=>`<option value="${w}" ${c.w===w?"selected":""}>${w||"מי מביא"}</option>`).join("")}
          </select>
          <button class="del" data-x="${esc(it.key)}" aria-label="מחק">×</button>
        </div>`;}).join("")}
      <div class="addbar">
        <input class="f" placeholder="פריט חדש" data-add="${esc(key+"::"+s.t)}">
        <input class="q" placeholder="כמות" data-addq="${esc(key+"::"+s.t)}">
        <button data-addbtn="${esc(key+"::"+s.t)}">הוסף</button>
      </div></section>`;}).join("");
}

function planEditHTML(){
  return planData().map((d,di)=>`<article class="day">
    <div class="ed"><input class="h" value="${esc(d.d)}" data-pl="${di},-,d" aria-label="שם היום">
      <input class="n" value="${esc(d.tag)}" data-pl="${di},-,tag" aria-label="כותרת משנה">
      <button data-delday="${di}" aria-label="מחק יום">×</button></div>
    ${d.slots.map((s,si)=>`<div class="ed">
      <input class="t" value="${esc(s.t)}" data-pl="${di},${si},t" aria-label="שעה">
      <input class="h" value="${esc(s.h)}" data-pl="${di},${si},h" aria-label="פעילות">
      <input class="n" value="${esc(s.s||"")}" data-pl="${di},${si},s" aria-label="פירוט">
      <button data-delslot="${di},${si}" aria-label="מחק שורה">×</button></div>`).join("")}
    <button class="dayadd" data-addslot="${di}">הוספת שורה</button>
  </article>`).join("")+`<button class="dayadd" data-addday="1">הוספת יום</button>`;
}

function asText(){
  const L=[];
  if(tab==="plan"){
    L.push("*גולן — לוח זמנים*","");
    planData().forEach(d=>{L.push("*"+d.d+"* — "+d.tag);
      d.slots.forEach(s=>L.push(s.t+"  "+s.h+(s.s?" — "+s.s:"")));L.push("");});
    L.push("*רעיונות לערבים*","");
    IDEAS.forEach(g=>{L.push("_"+g.k+"_");
      g.v.forEach(x=>L.push("• "+x.replace(/<[^>]+>/g,"")));L.push("");});
    return L.join("\n");
  }
  const label={shopping:"קניות",meat:"בשר",gear:"ציוד"}[tab];
  L.push("*גולן — "+label+"*","");
  sections(tab).forEach(s=>{
    const rows=s.items.filter(i=>!onlyLeft||!(state.checks[i.key]&&state.checks[i.key].d));
    if(!rows.length)return;
    L.push("*"+s.t+"*");
    rows.forEach(i=>{
      const c=state.checks[i.key]||{},q=(state.qty[i.key]!==undefined?state.qty[i.key]:i.qty);
      L.push((c.d?"✅ ":"▫️ ")+i.name+(q&&q!=="—"?" — "+q:"")+(c.w&&c.w!=="נקנה"?"  ("+c.w+")":""));
    });
    L.push("");
  });
  return L.join("\n");
}

let onlyLeft=false;
async function copyOut(){
  const txt=asText();
  try{ await navigator.clipboard.writeText(txt); $("#status").textContent="הועתק — אפשר להדביק בוואטסאפ"; $("#dump").classList.add("hidden"); }
  catch(e){ const d=$("#dump"); d.value=txt; d.classList.remove("hidden"); d.select(); $("#status").textContent="סמנו והעתיקו ידנית"; }
}

document.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]");
  if(act){
    const a=act.dataset.act;
    if(a==="edit"){editing=!editing;render();}
    if(a==="copy"){onlyLeft=false;copyOut();}
    if(a==="copyleft"){onlyLeft=true;copyOut();}
    if(a==="resetplan"&&confirm("לשחזור את הלו״ז המקורי? כל השינויים שלכם יימחקו.")){state.plan=null;render();save();}
    return;
  }
  const as=e.target.closest("[data-addslot]");
  if(as){const p=editablePlan();p[as.dataset.addslot].slots.push({t:"",h:"",s:""});render();save();return;}
  const ad=e.target.closest("[data-addday]");
  if(ad){editablePlan().push({d:"יום חדש",tag:"",slots:[{t:"",h:"",s:""}]});render();save();return;}
  const ds=e.target.closest("[data-delslot]");
  if(ds){const [a,b]=ds.dataset.delslot.split(",");editablePlan()[a].slots.splice(b,1);render();save();return;}
  const dd=e.target.closest("[data-delday]");
  if(dd&&confirm("למחוק את היום הזה מהלו״ז?")){editablePlan().splice(dd.dataset.delday,1);render();save();return;}

  const t=e.target.closest("[data-tab]");
  if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  const b=e.target.closest("[data-k]");
  if(b){
    const k=b.dataset.k;
    state.checks[k]=Object.assign({},state.checks[k],{d:!(state.checks[k]&&state.checks[k].d)});
    render();save();return;
  }
  const x=e.target.closest("[data-x]");
  if(x){
    if(!state.removed) state.removed=[];
    if(!state.removed.includes(x.dataset.x))state.removed.push(x.dataset.x);
    render();save();return;
  }
  const a=e.target.closest("[data-addbtn]");
  if(a){
    const [key,sec]=a.dataset.addbtn.split("::");
    const i=document.querySelector(`[data-add="${CSS.escape(key+"::"+sec)}"]`);
    const iq=document.querySelector(`[data-addq="${CSS.escape(key+"::"+sec)}"]`);
    const v=i.value.trim(); if(!v)return;
    state.custom[key]=state.custom[key]||[];
    state.custom[key].push({sec,name:v,qty:iq.value.trim()||"1",key:key+"|"+sec+"|"+v+"|"+Date.now()});
    i.value="";iq.value="";render();save();return;
  }
  if(e.target.id==="reset"&&confirm("לנקות את כל הסימונים והשיוכים? הכמויות והפריטים שהוספתם יישארו."))
    {state.checks={};render();save();}
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.pl){
    const [di,si,f]=t.dataset.pl.split(",");
    const p=editablePlan();
    if(si==="-") p[di][f]=t.value; else p[di].slots[si][f]=t.value;
    debSave(); return;
  }
  if(t.dataset.q){ state.qty[t.dataset.q]=t.value.trim(); debSave(); }
});

document.addEventListener("change",e=>{
  const w=e.target.closest("[data-w]");
  if(w){state.checks[w.dataset.w]=Object.assign({},state.checks[w.dataset.w],{w:w.value});render();save();return;}
  const q=e.target.closest("[data-q]");
  if(q){state.qty[q.dataset.q]=q.value.trim();save();}
});

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.dataset.add||e.target.dataset.addq){
    const s=e.target.dataset.add||e.target.dataset.addq;
    document.querySelector(`[data-addbtn="${CSS.escape(s)}"]`).click();
  } else if(e.target.dataset.q){ e.target.blur(); }
});

render(); 
initFirebaseSync();
</script>
</body>
</html>
